services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      AGENTSHIELD_HOST: 0.0.0.0
      AGENTSHIELD_PORT: 4141
      AGENTSHIELD_DATA_DIR: /data
    ports:
      - "127.0.0.1:4141:4141"
    volumes:
      - agentshield-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  agentshield-data:
